<!DOCTYPE html>
<html lang="en">
<head>
  <title>Your NeuroComet Magic Link</title>
  <style>
    body { font-family: 'Inter', sans-serif, Arial; background-color: #faf9f5; color: #2d3135; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border: 1px solid #f4f2ea; border-radius: 16px; padding: 40px; text-align: center; }
    .logo { background-color: #5e7364; color: #ffffff; width: 48px; height: 48px; border-radius: 12px; font-size: 24px; line-height: 48px; margin: 0 auto 20px auto; font-weight: bold; }
    h2 { color: #1a1d24; font-size: 24px; margin-bottom: 16px; }
    p { font-size: 16px; line-height: 1.6; color: #526b80; margin-bottom: 24px; }
    .button { display: inline-block; background-color: #5e7364; color: #ffffff !important; text-decoration: none; font-weight: bold; padding: 14px 28px; border-radius: 12px; margin-top: 10px; margin-bottom: 30px; }
    .footer { font-size: 12px; color: #94a3b8; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">☄️</div>
    <h2>Your Magic Link</h2>
    <p>Hello,</p>
    <p>Here is your magic link to sign in to NeuroComet. No password required!</p>

    <a href="{{ .ConfirmationURL }}" class="button">Log In Securely</a>

    <p>If you prefer to enter a code manually in the app, use this one-time passcode:</p>
    <h2 style="letter-spacing: 0.2em; font-family: monospace;">{{ .Token }}</h2>

    <div class="footer">
      &copy; NeuroComet. A safe, sensory-friendly social space.
    </div>
  </div>
</body>
</html>
